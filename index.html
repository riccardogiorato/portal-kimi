<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0e14" />
    <title>PORTAL — Aperture Science Computer-Aided Enrichment Center</title>
    <style>
      /* Critical first-paint styles only; the UI subsystem owns the rest. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0e14;
        font-family:
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
        touch-action: none;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0a0e14;
        color: #9db2c8;
        letter-spacing: 0.35em;
        font-size: 13px;
        text-transform: uppercase;
        z-index: 1000;
        transition: opacity 0.6s ease;
      }
      #boot-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .boot-spinner {
        width: 42px;
        height: 42px;
        border: 2px solid rgba(157, 178, 200, 0.15);
        border-top-color: #6ec1ff;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="boot-screen">
      <div class="boot-spinner"></div>
      <div>Aperture Science</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
